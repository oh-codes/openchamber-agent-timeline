<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agent timeline</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: var(--oc-bg, #14151a);
        color: var(--oc-fg, #e8e8ee);
        overflow: hidden;
      }
      body { font-family: var(--oc-font, system-ui, sans-serif); font-size: 0.82rem; line-height: 1.4; }
      * { box-sizing: border-box; }

      #root { display: flex; flex-direction: column; height: 100%; min-height: 0; }

      /* header */
      .top { display: flex; align-items: center; gap: 0.4rem; padding: 0.55rem 0.65rem 0.15rem; }
      .top .agent {
        font-family: var(--oc-mono, monospace); font-size: 0.78rem; font-weight: 600;
        padding: 0.05rem 0.35rem; border-radius: var(--oc-radius, 6px);
        background: color-mix(in srgb, var(--oc-primary, #6c8cff) 16%, transparent);
        color: var(--oc-primary-text, var(--oc-primary, #6c8cff));
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 45%;
      }
      .top .title { color: var(--oc-muted, #9a9aa8); font-size: 0.78rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
      .dot { width: 0.42rem; height: 0.42rem; border-radius: 50%; flex: none; background: var(--oc-muted, #9a9aa8); }
      .dot.working { background: var(--oc-success, #3fb950); box-shadow: 0 0 0.35rem color-mix(in srgb, var(--oc-success, #3fb950) 70%, transparent); }
      .icon {
        flex: none; background: transparent; border: 1px solid transparent; color: var(--oc-muted, #9a9aa8);
        border-radius: var(--oc-radius, 6px); font: inherit; line-height: 1; padding: 0.2rem 0.32rem; cursor: pointer;
      }
      .icon:hover { color: var(--oc-fg); border-color: var(--oc-border, #2c2d36); background: var(--oc-hover, rgba(255,255,255,.05)); }

      .meta { padding: 0 0.65rem 0.4rem; color: var(--oc-muted, #9a9aa8); font-family: var(--oc-mono, monospace); font-size: 0.68rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

      /* toolbar */
      .bar { display: flex; align-items: center; gap: 0.4rem; padding: 0 0.65rem 0.4rem; }
      .modes { display: inline-flex; border: 1px solid var(--oc-border, #2c2d36); border-radius: var(--oc-radius, 6px); overflow: hidden; }
      .modes button {
        background: transparent; border: 0; color: var(--oc-muted, #9a9aa8); font: inherit; font-size: 0.68rem;
        padding: 0.15rem 0.45rem; cursor: pointer;
      }
      .modes button[aria-pressed="true"] { background: var(--oc-selection, rgba(255,255,255,.08)); color: var(--oc-fg); }
      .count { margin-left: auto; color: var(--oc-muted, #9a9aa8); font-size: 0.68rem; font-family: var(--oc-mono, monospace); }

      /* axis */
      .axis { position: relative; height: 0.85rem; margin: 0 0.65rem; border-bottom: 1px solid color-mix(in srgb, var(--oc-border, #2c2d36) 80%, transparent); flex: none; }
      .axis span { position: absolute; top: 0; font-size: 0.6rem; color: var(--oc-muted, #9a9aa8); font-family: var(--oc-mono, monospace); transform: translateX(-50%); }
      .axis span:first-child { transform: none; }
      .axis span:last-child { transform: translateX(-100%); }

      /* lanes */
      .lanes { flex: 0 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 0.25rem 0 0.5rem; }
      .lane { display: flex; align-items: center; gap: 0.4rem; padding: 0.1rem 0.65rem; }
      .lane:hover { background: color-mix(in srgb, var(--oc-hover, rgba(255,255,255,.04)) 60%, transparent); }
      .lane .label {
        width: 5.2rem; flex: none; font-family: var(--oc-mono, monospace); font-size: 0.64rem; color: var(--oc-muted, #9a9aa8);
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      .lane.root .label { color: var(--oc-fg); }
      .lane .label .depth { opacity: 0.55; }
      .track { position: relative; flex: 1; min-width: 0; }

      .seg {
        position: absolute; border-radius: 2px; cursor: pointer; min-width: 2px;
        transition: filter 90ms linear;
      }
      .seg:hover { filter: brightness(1.4); }
      .seg.sel { outline: 1px solid var(--oc-fg); outline-offset: 1px; }
      .seg.reasoning { background: color-mix(in srgb, var(--oc-info, #58a6ff) 55%, transparent); }
      .seg.tool { background: color-mix(in srgb, var(--oc-primary, #6c8cff) 78%, transparent); }
      .seg.tool.error { background: var(--oc-error, #f85149); }
      .seg.tool.running { background: var(--oc-warning, #d29922); }
      .seg.text { background: color-mix(in srgb, var(--oc-success, #3fb950) 62%, transparent); }
      .seg.user { background: color-mix(in srgb, var(--oc-muted, #9a9aa8) 70%, transparent); }

      .cut { position: absolute; top: -0.1rem; bottom: -0.1rem; width: 1px; background: repeating-linear-gradient(to bottom, var(--oc-border, #2c2d36) 0 3px, transparent 3px 6px); pointer-events: none; }

      /* legend + states */
      .legend { display: flex; flex-wrap: wrap; gap: 0.55rem; padding: 0.35rem 0.65rem 0.5rem; border-top: 1px solid var(--oc-border, #2c2d36); font-size: 0.64rem; color: var(--oc-muted, #9a9aa8); flex: none; }
      .legend i { width: 0.42rem; height: 0.42rem; border-radius: 1px; display: inline-block; margin-right: 0.2rem; vertical-align: -0.03rem; }
      .empty, .note { padding: 0.9rem 0.65rem; color: var(--oc-muted, #9a9aa8); font-size: 0.72rem; }
      .note.error { color: var(--oc-error-text, var(--oc-error, #f85149)); }

      /* drawer */
      .drawer { margin-top: auto; border-top: 1px solid var(--oc-border, #2c2d36); background: var(--oc-elevated, rgba(255,255,255,.04)); max-height: 52%; display: flex; flex-direction: column; flex: none; }
      .drawer[hidden] { display: none; }
      .dhead { display: flex; align-items: center; gap: 0.4rem; padding: 0.4rem 0.65rem; font-family: var(--oc-mono, monospace); font-size: 0.68rem; color: var(--oc-muted, #9a9aa8); }
      .dhead b { color: var(--oc-fg); font-weight: 600; }
      .dhead .grow { flex: 1; }
      .dhead button { background: none; border: 0; color: var(--oc-muted, #9a9aa8); cursor: pointer; font: inherit; padding: 0 0.2rem; }
      .dhead button:hover { color: var(--oc-fg); }
      .dbody { overflow: auto; padding: 0 0.65rem 0.6rem; }
      .dbody dl { display: grid; grid-template-columns: auto 1fr; gap: 0.1rem 0.5rem; margin: 0 0 0.45rem; font-size: 0.68rem; font-family: var(--oc-mono, monospace); }
      .dbody dt { color: var(--oc-muted, #9a9aa8); }
      .dbody dd { margin: 0; word-break: break-word; }
      .dbody pre {
        margin: 0 0 0.45rem; padding: 0.4rem 0.5rem; background: var(--oc-muted-surface, rgba(0,0,0,.22));
        border-radius: var(--oc-radius, 6px); font-family: var(--oc-mono, monospace); font-size: 0.68rem;
        white-space: pre-wrap; word-break: break-word; max-height: 14rem; overflow: auto;
      }
      .dbody .cap { font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--oc-muted, #9a9aa8); margin: 0 0 0.2rem; }
    </style>
  </head>
  <body>
    <div id="root">
      <header class="top">
        <span id="status" class="dot"></span>
        <span id="agent" class="agent">—</span>
        <span id="title" class="title"></span>
        <button id="reload" class="icon" type="button" title="Reload">↻</button>
      </header>
      <div id="meta" class="meta"></div>
      <div class="bar">
        <div class="modes" id="modes">
          <button type="button" data-mode="active">active</button>
          <button type="button" data-mode="time">clock</button>
        </div>
        <span id="count" class="count"></span>
      </div>
      <div id="axis" class="axis"></div>
      <div id="lanes" class="lanes"></div>
      <footer id="legend" class="legend"></footer>
      <div id="drawer" class="drawer" hidden>
        <div class="dhead">
          <b id="d-kind"></b>
          <span id="d-what"></span>
          <span class="grow"></span>
          <button id="d-close" type="button" title="Close">✕</button>
        </div>
        <div id="d-body" class="dbody"></div>
      </div>
    </div>
    <script src="./main.js"></script>
  </body>
</html>
