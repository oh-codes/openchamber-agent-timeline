<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>Agent timeline · harness</title>
    <style>
      body { margin: 0; background: #0d0d11; color: #a4a4b4; font: 13px system-ui, sans-serif; }
      .row { display: flex; gap: 16px; padding: 16px; align-items: flex-start; }
      .rail { width: var(--rail, 340px); height: 760px; flex: none; border-radius: 10px; overflow: hidden; box-shadow: 0 0 0 1px #26262f; }
      .wide { flex: 1; height: 760px; border-radius: 10px; overflow: hidden; box-shadow: 0 0 0 1px #26262f; }
      iframe { width: 100%; height: 100%; border: 0; display: block; background: #141419; }
      h2 { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; margin: 0 0 6px; color: #6f6f80; }
      .hint { padding: 16px; color: #8f8fa1; font-size: 13px; }
    </style>
  </head>
  <body style="--rail: 320px">
    <div class="row">
      <div>
        <h2>Rail · 340 px</h2>
        <div class="rail"><iframe id="rail"></iframe></div>
      </div>
      <div style="flex:1">
        <h2>Page · full width</h2>
        <div class="wide"><iframe id="page"></iframe></div>
      </div>
    </div>
    <script>
      // Stand-in host for `npm run dev`: speaks the SDK wire protocol against
      // the panel and answers service-request through /svc (see dev/serve.mjs).
      const theme = {
        mode: 'dark',
        tokens: {
          background: '#141419', elevated: '#1b1b22', foreground: '#e6e6ef', muted: '#8f8fa1', subtle: '#5d5d6d',
          border: '#2b2b36', hover: '#22222b', selection: '#2b2b38', focus: '#6c8cff', primary: '#6c8cff',
          mutedSurface: '#1a1a21', elevatedForeground: '#f0f0f7', active: '#2f2f3c', selectionForeground: '#ffffff',
          primaryForeground: '#0d0d11', primaryText: '#93a9ff', successText: '#7ee2a8', warningText: '#f0c674',
          errorText: '#ff8f8a', infoText: '#8fc4ff', success: '#3fb950', warning: '#d29922', error: '#f85149',
          info: '#58a6ff', font: 'system-ui, -apple-system, Segoe UI, sans-serif',
          mono: 'ui-monospace, SFMono-Regular, Consolas, monospace', radius: '8px',
        },
      };

      (async () => {
        const params = new URLSearchParams(location.search);
        let sessionId = params.get('session');
        let session = null;

        if (!sessionId) {
          const list = await fetch('/sessions').then((r) => r.json()).catch(() => []);
          if (!list.length) {
            document.body.innerHTML = '<p class="hint">No session found. Pass <code>?session=&lt;id&gt;</code>.</p>';
            return;
          }
          sessionId = list[0].id;
          session = list[0];
        }

        const hostSize = new URLSearchParams(location.search).get('hs');
        const context = {
          theme: hostSize ? { ...theme, tokens: { ...theme.tokens, fontSize: `${hostSize}px` } } : theme,
          locale: 'de',
          directory: session?.directory || '',
          session: {
            id: sessionId,
            title: session?.title || sessionId,
            busy: Boolean(session?.busy),
            model: session?.model || undefined,
            agent: session?.agent || undefined,
          },
          surface: 'panel',
          connection: { connected: false, account: '' },
          settings: {},
          item: null,
        };

        const frames = [document.getElementById('rail'), document.getElementById('page')];

        for (const frame of frames) {
          window.addEventListener('message', async (event) => {
            if (event.source !== frame.contentWindow) return;
            const message = event.data;
            if (!message || message.channel !== 'openchamber.sdk' || message.v !== 1) return;

            if (message.type === 'hello') {
              frame.contentWindow.postMessage({ channel: 'openchamber.sdk', v: 1, type: 'ready', payload: context }, '*');
              return;
            }
            if (message.type === 'storage') {
              // Minimal guest storage so the panel's text size persists in dev too.
              const read = () => { try { return JSON.parse(sessionStorage.getItem('guest-storage') || '{}'); } catch { return {}; } };
              const store = {
                has: (key) => key in read(),
                get: (key) => read()[key],
                set: (key, value) => sessionStorage.setItem('guest-storage', JSON.stringify({ ...read(), [key]: value })),
                delete: (key) => { const all = read(); delete all[key]; sessionStorage.setItem('guest-storage', JSON.stringify(all)); },
                keys: () => Object.keys(read()),
              };
              const { op, key, value } = message.payload || {};
              let result = { storage: true, op };
              if (op === 'get') result = store.has(key) ? { ...result, found: true, value: store.get(key) } : { ...result, found: false };
              else if (op === 'set') store.set(key, value);
              else if (op === 'delete') store.delete(key);
              else if (op === 'keys') result = { ...result, keys: [...store.keys()] };
              frame.contentWindow.postMessage({ channel: 'openchamber.sdk', v: 1, type: 'result', id: message.id, ok: true, payload: result }, '*');
              return;
            }
            if (message.type === 'service-request') {
              const query = new URLSearchParams(message.payload.query || {});
              const url = '/svc' + message.payload.path + (query.toString() ? '?' + query.toString() : '');
              try {
                const response = await fetch(url);
                const body = await response.text();
                frame.contentWindow.postMessage(
                  { channel: 'openchamber.sdk', v: 1, type: 'result', id: message.id, ok: true, payload: { status: response.status, body } },
                  '*',
                );
              } catch (error) {
                frame.contentWindow.postMessage(
                  { channel: 'openchamber.sdk', v: 1, type: 'result', id: message.id, ok: false, error: String(error), code: 'SERVICE_FAILED' },
                  '*',
                );
              }
            }
          });
        }

        for (const frame of frames) frame.src = '/panel/index.html';

        // Wait for the bars instead of guessing when the first fetch lands.
        const waitForBars = (run) => {
          const attempt = (left) => {
            if (frames.every(run) || left <= 0) return;
            setTimeout(() => attempt(left - 1), 300);
          };
          attempt(40);
        };

        // The CDP click path in the dev Chrome hangs on iframes, so these run
        // the handlers from the parent document instead.
        if (params.has('clock')) {
          setTimeout(() => {
            for (const frame of frames) frame.contentDocument?.querySelector('button[data-mode="time"]')?.click();
          }, 2200);
        }
        if (params.has('zoom')) {
          const times = Math.min(12, Number(params.get('zoom')) || 2);
          waitForBars((frame) => {
            const doc = frame.contentDocument;
            // The button exists in the markup long before the script attaches its
            // listener: wait for a rendered bar, which means the panel is live.
            if (!doc?.querySelector('.seg')) return false;
            const button = doc.querySelector('[data-zoom="in"]');
            if (!button) return false;
            for (let i = 0; i < times; i++) button.dispatchEvent(new MouseEvent('click', { bubbles: true }));
            return true;
          });
        }

        if (params.has('dbl')) {
          waitForBars((frame) => {
            const doc = frame.contentDocument;
            const bars = doc?.querySelectorAll('.seg.tool, .seg.reasoning');
            if (!bars || bars.length < 4) return false;
            const bar = bars[Math.floor(bars.length / 2)];
            bar.dispatchEvent(new MouseEvent('dblclick', { bubbles: true }));
            return true;
          });
        }
        if (params.has('pan')) {
          waitForBars((frame) => {
            const doc = frame.contentDocument;
            const track = doc?.querySelector('.track');
            if (!track) return false;
            // Panning the whole span is a no-op: zoom in first.
            const zoomIn = doc.querySelector('[data-zoom="in"]');
            for (let i = 0; i < 2; i++) zoomIn?.dispatchEvent(new MouseEvent('click', { bubbles: true }));
            const rect = track.getBoundingClientRect();
            const y = rect.top + 6;
            const send = (type, clientX) =>
              track.dispatchEvent(new PointerEvent(type, { bubbles: true, pointerId: 1, button: 0, buttons: 1, clientX, clientY: y }));
            // Drag rightwards: the window moves back into the past.
            send('pointerdown', rect.left + rect.width * 0.25);
            for (let step = 1; step <= 6; step++) send('pointermove', rect.left + rect.width * (0.25 + step * 0.08));
            send('pointerup', rect.left + rect.width * 0.73);
            return true;
          });
        }
        if (params.has('edge')) {
          const extraZoom = Number(params.get('edge')) || 0;
          waitForBars((frame) => {
            const doc = frame.contentDocument;
            const map = doc?.querySelector('#map');
            if (!map || !doc.querySelector('.seg')) return false;
            // Click near the right end of the strip: the window jumps there and
            // should then stay on the newest data.
            const rect = map.getBoundingClientRect();
            const at = { bubbles: true, pointerId: 1, button: 0, clientX: rect.right - 2, clientY: rect.top + 4 };
            map.dispatchEvent(new PointerEvent('pointerdown', { ...at, buttons: 1 }));
            map.dispatchEvent(new PointerEvent('pointerup', { ...at, buttons: 0 }));
            const zoomIn = doc.querySelector('[data-zoom="in"]');
            for (let i = 0; i < extraZoom; i++) zoomIn?.dispatchEvent(new MouseEvent('click', { bubbles: true }));
            return true;
          });
        }
        if (params.has('reset')) {
          waitForBars((frame) => {
            const doc = frame.contentDocument;
            if (!doc?.querySelector('.seg')) return false;
            const button = doc.querySelector('[data-zoom="fit"]');
            if (!button || button.hidden) return false;
            button.dispatchEvent(new MouseEvent('click', { bubbles: true }));
            return true;
          });
        }
        if (params.has('font')) {
          const times = Math.min(5, Number(params.get('font')) || 1);
          waitForBars((frame) => {
            const doc = frame.contentDocument;
            if (!doc?.querySelector('.seg')) return false;
            const button = doc.querySelector('#font');
            if (!button) return false;
            for (let i = 0; i < times; i++) button.dispatchEvent(new MouseEvent('click', { bubbles: true }));
            return true;
          });
        }
        if (params.has('mapdrag')) {
          waitForBars((frame) => {
            const doc = frame.contentDocument;
            const map = doc?.querySelector('#map');
            const win = doc?.querySelector('#map-win');
            if (!map || !win || win.hidden) return false;
            const rect = map.getBoundingClientRect();
            const winRect = win.getBoundingClientRect();
            const y = rect.top + rect.height / 2;
            const startX = winRect.left + winRect.width / 2;
            const send = (type, x, target) =>
              target.dispatchEvent(new PointerEvent(type, { bubbles: true, pointerId: 1, button: 0, buttons: 1, clientX: x, clientY: y }));
            send('pointerdown', startX, win);
            for (let step = 1; step <= 5; step++) send('pointermove', startX - step * rect.width * 0.06, win);
            send('pointerup', startX - rect.width * 0.3, win);
            return true;
          });
        }
        if (params.has('clickw')) {
          waitForBars((frame) => {
            const doc = frame.contentDocument;
            const bar = doc?.querySelector('.seg.waiting');
            if (!bar) return false;
            const rect = bar.getBoundingClientRect();
            const at = { bubbles: true, pointerId: 1, button: 0, clientX: rect.left + 3, clientY: rect.top + 2 };
            bar.dispatchEvent(new PointerEvent('pointerdown', { ...at, buttons: 1 }));
            bar.dispatchEvent(new PointerEvent('pointerup', { ...at, buttons: 0 }));
            bar.dispatchEvent(new MouseEvent('click', { bubbles: true, clientX: at.clientX, clientY: at.clientY }));
            return true;
          });
        }
        if (params.has('click')) {
          waitForBars((frame) => {
            const bar = frame.contentDocument?.querySelector('.seg.tool, .seg.reasoning');
            if (!bar) return false;
            const rect = bar.getBoundingClientRect();
            const at = { bubbles: true, pointerId: 1, button: 0, clientX: rect.left + 2, clientY: rect.top + 2 };
            // A real press, not a bare click event: the click event alone hid the
            // regression where pointer capture swallowed the click on a bar.
            bar.dispatchEvent(new PointerEvent('pointerdown', { ...at, buttons: 1 }));
            bar.dispatchEvent(new PointerEvent('pointerup', { ...at, buttons: 0 }));
            bar.dispatchEvent(new MouseEvent('click', { bubbles: true, clientX: at.clientX, clientY: at.clientY }));
            return true;
          });
        }
      })();
    </script>
  </body>
</html>
